<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slingland</title>
  <meta name="description" content="slingland: Google for memes. Search your meme collection by what is in the picture and what it says. Everything runs in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/sling-avatar.png?v=25">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/brand/sling-avatar.png?v=25">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/sling-avatar.png?v=25">
  <link rel="apple-touch-icon" href="assets/brand/sling-avatar.png?v=25">
  <link rel="stylesheet" href="css/memegle.css?v=25">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('memegle.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/terminal.css?v=25">
<meta property="og:title" content="slingland — All memes. One place."><meta property="og:image" content="assets/brand/sling-avatar.png"><meta name="theme-color" content="#fff5fc"></head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" class="toast" role="status"></div>
  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple class="hidden">
  <input id="lens-input" type="file" accept="image/*" class="hidden">
  <input id="import-input" type="file" accept="application/json" class="hidden">
  <noscript><p style="padding:40px;text-align:center;font-family:arial">slingland needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js?v=25"></script>
</body>
</html>
